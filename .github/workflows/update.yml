# Twice-daily data update. Runs the same script as the Claude task, but here the state
# (database, models, phone page) can be pushed to the "data" branch
# Basketball Reference publishes the night's box scores around 5 AM US Eastern (10:00 UTC in winter).
name: NBA Update
on:
  schedule:
    # Each slot twice: GitHub may delay or drop scheduled runs (it skipped one on 2026-11-16);
    # a second run is harmless (same data, suggestions of open games are simply replaced).
    - cron: "15 10 * * *"   # results of the night (published ~10:06 UTC)
    - cron: "38 10 * * *"
    - cron: "5 15 * * *"    # injury report / evening games
    - cron: "28 15 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nba-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update and save state
        env:
          NBI_STATE_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          bash scripts/scheduled_update.sh 2> update.err | tail -1 | tee result.json
          grep -q '"stateSaved":true' result.json || { tail -40 update.err; exit 1; }
      - name: Log on failure
        if: failure()
        run: tail -60 update.err /tmp/nbi-update.log || true
